name: Release Tag

# Step 2 of a release (openctemio/openctem api/docs/rfcs/RFC-037 §6): when a
# release/vX.Y.Z PR merges into main, tag the merge commit vX.Y.Z (only if it
# carries the release: the CHANGELOG section and pkg/sdk.Version). The tag
# runs release.yml. Then, with RELEASE_TOKEN:
#   - openctemio/sensor: "deps: sdk-go vX.Y.Z" (go get + go mod tidy);
#   - openctemio/openctem: versions.yaml sdk.latest = vX.Y.Z.
# Without RELEASE_TOKEN the tag is pushed with GITHUB_TOKEN, which starts no
# workflow, so release.yml is dispatched on the tag; the cross-repo PRs are
# skipped with a message.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the merged release PR (release/vX.Y.Z -> main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

env:
  RELEASE_SCRIPTS: .github/scripts/release

jobs:
  tag:
    name: Tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.pr.outputs.version }}
    steps:
      - name: Read the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,mergeCommit,state,baseRefName > pr.json
          head_ref="$(jq -r .headRefName pr.json)"
          [ "$(jq -r .state pr.json)" = MERGED ] || { echo "::error::PR $PR is not merged"; exit 1; }
          [ "$(jq -r .baseRefName pr.json)" = main ] || { echo "::error::PR $PR does not target main"; exit 1; }
          [[ "$head_ref" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$head_ref is not release/vX.Y.Z"; exit 1; }
          { echo "version=${head_ref#release/}"; echo "merge=$(jq -r .mergeCommit.oid pr.json)"; } >> "$GITHUB_OUTPUT"

      - name: Token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then echo "has_release_token=true" >> "$GITHUB_OUTPUT"; else echo "has_release_token=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag ${{ steps.pr.outputs.version }}
        env:
          VERSION: ${{ steps.pr.outputs.version }}
          MERGE: ${{ steps.pr.outputs.merge }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash "$RELEASE_SCRIPTS/tag-release.sh" --version "$VERSION" --commit "$MERGE" --push

      - name: Start the release workflows
        if: steps.token.outputs.has_release_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          for wf in release.yml docker-publish.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
            fi
          done

  downstream:
    name: Downstream PRs
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then echo "has_release_token=true" >> "$GITHUB_OUTPUT"; else echo "has_release_token=false" >> "$GITHUB_OUTPUT"; fi

      - name: Skipped without RELEASE_TOKEN
        if: steps.token.outputs.has_release_token != 'true'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          msg="Skipped the sensor and openctem PRs: they need the RELEASE_TOKEN secret. By hand: go get github.com/openctemio/sdk-go@${VERSION} in openctemio/sensor; versions.yaml sdk.latest = ${VERSION} in openctemio/openctem."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.token.outputs.has_release_token == 'true'
        with:
          # The sensor's toolchain (its release.yml); go.mod's toolchain line wins anyway.
          go-version: '1.26.8'
          cache: false

      - name: openctemio/sensor - deps sdk-go
        if: steps.token.outputs.has_release_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          GOWORK: "off"
          GOPROXY: direct
          GONOSUMDB: github.com/openctemio/*
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/openctemio/sensor.git" "$RUNNER_TEMP/sensor"
          cd "$RUNNER_TEMP/sensor"
          branch="deps/sdk-go-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "$branch exists"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          go get "github.com/openctemio/sdk-go@${VERSION}"
          go mod tidy
          if git diff --quiet; then echo "sensor already on sdk-go ${VERSION}"; exit 0; fi
          git commit -qam "deps: sdk-go ${VERSION}"
          git push -q origin "$branch"
          url="$(gh pr create --repo openctemio/sensor --base main --head "$branch" --title "deps: sdk-go ${VERSION}" \
            --body "sdk-go ${VERSION} is tagged: https://github.com/openctemio/sdk-go/releases/tag/${VERSION}. Opened by Release Tag in openctemio/sdk-go. Build and test before merging; the SDK's CHANGELOG lists what changed.")"
          echo "sensor PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: openctemio/openctem - versions.yaml sdk.latest
        if: steps.token.outputs.has_release_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          git clone --quiet --branch develop "https://x-access-token:${GH_TOKEN}@github.com/openctemio/openctem.git" "$RUNNER_TEMP/openctem"
          cd "$RUNNER_TEMP/openctem"
          sync=.github/scripts/release/sync-versions.sh
          if [ ! -f versions.yaml ] || [ ! -f "$sync" ]; then echo "::warning::openctem has no versions.yaml yet; skipped"; exit 0; fi
          branch="chore/sdk-latest-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "$branch exists"; exit 0; fi
          # shellcheck source=/dev/null
          source .github/scripts/release/lib.sh
          rel_yaml_set versions.yaml sdk.latest "$VERSION"
          bash "$sync"
          if git diff --quiet; then echo "openctem already says sdk ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          git commit -qam "chore(versions): sdk.latest = ${VERSION}"
          git push -q origin "$branch"
          url="$(gh pr create --repo openctemio/openctem --base develop --head "$branch" --title "chore(versions): sdk.latest = ${VERSION}" \
            --body "sdk-go ${VERSION} is tagged. versions.yaml sdk.latest follows (sensors built with an older SDK show as outdated). Opened by Release Tag in openctemio/sdk-go.")"
          echo "openctem PR: $url" >> "$GITHUB_STEP_SUMMARY"
