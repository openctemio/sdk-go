name: Release

on:
  push:
    tags:
      - 'v*'
  # Release Tag (release-tag.yml) dispatches this on the tag (`--ref vX.Y.Z`)
  # when it pushed the tag with GITHUB_TOKEN, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 .github/scripts/release/sanitize-notes.py notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  cli:
    # Prebuilt CLI binaries, so a tool author writing Python or shell does not
    # need the Go toolchain. Built here from the tag; the checksums file is
    # signed keyless (the workflow's OIDC identity), nothing is built elsewhere.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build, checksum and sign
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="$(mktemp -d)"
            exe=openctem
            [ "$goos" = windows ] && exe=openctem.exe
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$stage/$exe" ./cmd/openctem
            cp LICENSE NOTICE "$stage/"
            if [ "$goos" = windows ]; then
              # A zip with openctem.exe at its root: Explorer and
              # Expand-Archive open it (-X: no extra file attributes).
              (cd "$stage" && zip -q -X "$GITHUB_WORKSPACE/dist/openctem_${version}_${goos}_${goarch}.zip" "$exe" LICENSE NOTICE)
            else
              tar -C "$stage" -czf "dist/openctem_${version}_${goos}_${goarch}.tar.gz" "$exe" LICENSE NOTICE
            fi
          done
          cd dist
          # One checksums file, signed once, covers every archive.
          sha256sum ./*.tar.gz ./*.zip | sed 's# \./# #' > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
