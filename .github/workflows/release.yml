name: Release

on:
  push:
    tags:
      - 'v*'
  # Release Tag (release-tag.yml) dispatches this on the tag (`--ref vX.Y.Z`)
  # when it pushed the tag with GITHUB_TOKEN, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 .github/scripts/release/sanitize-notes.py notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  cli:
    # Prebuilt CLI binaries, so a tool author writing Python or shell does not
    # need the Go toolchain. Built here from the tag; the checksums file is
    # signed keyless (the workflow's OIDC identity), nothing is built elsewhere.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build, checksum and sign
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$stage/openctem" ./cmd/openctem
            cp LICENSE NOTICE "$stage/"
            tar -C "$stage" -czf "dist/openctem_${version}_${goos}_${goarch}.tar.gz" openctem LICENSE NOTICE
          done
          cd dist
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
