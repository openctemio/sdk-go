name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the older run: force-pushed
# and rebased branches otherwise queue every superseded commit and starve the
# organisation's concurrent-job limit. Tags (releases) and the scheduled scan
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # Changelog entries live one file per change in changelog.d/, so pull
  # requests never conflict on CHANGELOG.md. Refuses an entry written under
  # the Unreleased heading, an invalid fragment, and merge-conflict markers in
  # any tracked text file.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog fragments and conflict markers
        run: python3 .github/scripts/release/changelog-fragments.py check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          # Tests drive the SDK against httptest.NewServer, which binds
          # to 127.0.0.1. pkg/httpsec.SafeHTTPClient normally rejects
          # loopback targets; the env var opts tests into the loopback
          # carve-out. Its own unit tests still assert the production
          # posture (AllowLoopback=false via TestMain).
          OPENCTEM_SDK_HTTPSEC_ALLOW_LOOPBACK: "1"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out

  # The sandbox's network confinement needs unprivileged user namespaces,
  # which the runner's host refuses (AppArmor). Its tests run here in a
  # container whose seccomp profile allows them, as a non-root user the
  # host does not otherwise use, and must not skip.
  sandbox-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Build the executor and tool host tests
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/netns/executor.test" ./pkg/sensorkit/executor/
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/netns/toolhost.test" ./pkg/sensorkit/toolhost/

      - name: Run them confined
        run: |
          chmod -R a+rX "$RUNNER_TEMP/netns" .
          # Each runs in its package directory (tests read testdata/).
          for t in executor toolhost; do
            docker run --rm --user 23456:23456 --security-opt seccomp=unconfined \
              -e OPENCTEM_TEST_REQUIRE_NETNS=1 -v "$RUNNER_TEMP/netns:/t:ro" \
              -v "$PWD/pkg/sensorkit/$t:/src:ro" -w /src \
              public.ecr.aws/docker/library/debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
              "/t/$t.test" -test.v -test.count=1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.13.1

  # pkg/ctis re-exports github.com/openctemio/ctis (generated aliases). Fails
  # when the generated file is stale for the ctis version in go.mod, or when
  # pkg/ctis starts copying model types again — see scripts/check-ctis-parity.sh.
  ctis-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Check pkg/ctis re-exports the CTIS module
        run: ./scripts/check-ctis-parity.sh

  # Sensor protocol v3 (openctem api RFC-059): the .proto is the platform's,
  # buf lint passes and pkg/sensorproto/v3 is what buf generate writes.
  proto-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Proto v3 copy, lint and generated code
        run: ./scripts/check-proto-v3.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Build
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # Exported-API compatibility (api RFC-029 §8.6), weighed by stability tier
  # (docs/STABILITY.md; every package comment states its tier): an
  # incompatible change to a Stable or Frozen package fails unless the PR is
  # labelled breaking-change (and a changelog.d/ fragment says how to upgrade
  # under "### Upgrade notes"); a Beta change is a warning; Internal-bound and
  # Deprecated packages are ignored. A package without a tier fails.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba

      - name: Tests of the compatibility check
        run: bash scripts/test-api-compat.sh

      # Gate on THIS change only: compare with the PR base (origin/<base>), so an
      # intended break that already merged with its breaking-change label does
      # not fail every later PR until the next release. A push to main compares
      # with the latest release as a report: every change on main passed this
      # gate as a PR, so its breaks are declared (warnings, not a red main).
      - name: Compare with the base branch (PR) or the latest release (push)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        env:
          API_COMPAT_BREAKING_DECLARED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: scripts/check-api-compat.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Compare with the base branch (breaking change declared)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        env:
          API_COMPAT_BREAKING_DECLARED: '1'
        run: |
          scripts/check-api-compat.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          grep -qs '^### Upgrade notes' changelog.d/*.md || { echo "::error::breaking-change needs a changelog.d/<slug>.md fragment with an '### Upgrade notes' section"; exit 1; }

  # The sensor (github.com/openctemio/sensor, main) must build against this
  # change without edits: that is what "bump the SDK and done" means for the
  # one sensor we ship. Both builds (default and -tags platform) and vet.
  sensor-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk-go

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/sensor
          ref: main
          path: sensor

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false

      - name: Build the sensor against this SDK
        working-directory: sensor
        env:
          GOWORK: "off"
        run: |
          go mod edit -replace github.com/openctemio/sdk-go=../sdk-go
          go mod tidy
          go build ./...
          go build -tags platform ./...
          go vet ./...
