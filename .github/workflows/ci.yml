name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the older run: force-pushed
# and rebased branches otherwise queue every superseded commit and starve the
# organisation's concurrent-job limit. Tags (releases) and the scheduled scan
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          # Tests drive the SDK against httptest.NewServer, which binds
          # to 127.0.0.1. pkg/httpsec.SafeHTTPClient normally rejects
          # loopback targets; the env var opts tests into the loopback
          # carve-out. Its own unit tests still assert the production
          # posture (AllowLoopback=false via TestMain).
          OPENCTEM_SDK_HTTPSEC_ALLOW_LOOPBACK: "1"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.13.1

  # Guards against CTIS schema drift: pkg/ctis is a copy of the canonical
  # github.com/openctemio/ctis module (RFC-002). They must carry the same enum
  # constants — see scripts/check-ctis-parity.sh.
  ctis-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check CTIS enum parity with canonical module
        run: ./scripts/check-ctis-parity.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Build
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # Exported-API compatibility (api RFC-029 §8.6): a sensor built against the
  # last release must build against this change. Any incompatible change to an
  # exported identifier fails unless the PR is labelled breaking-change (and
  # CHANGELOG.md says how to upgrade under "Upgrade notes").
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba

      - name: Compare with the latest release
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: scripts/check-api-compat.sh

      - name: Compare with the latest release (breaking change declared)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          scripts/check-api-compat.sh || echo "::warning::incompatible API change declared with the breaking-change label"
          grep -q '^### Upgrade notes' CHANGELOG.md || { echo "::error::breaking-change needs an 'Upgrade notes' section in CHANGELOG.md"; exit 1; }

  # The sensor (github.com/openctemio/sensor, main) must build against this
  # change without edits: that is what "bump the SDK and done" means for the
  # one sensor we ship. Both builds (default and -tags platform) and vet.
  sensor-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sdk-go

      - uses: actions/checkout@v7
        with:
          repository: openctemio/sensor
          ref: main
          path: sensor

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build the sensor against this SDK
        working-directory: sensor
        env:
          GOWORK: "off"
        run: |
          go mod edit -replace github.com/openctemio/sdk-go=../sdk-go
          go mod tidy
          go build ./...
          go build -tags platform ./...
          go vet ./...
