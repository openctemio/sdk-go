name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the older run: force-pushed
# and rebased branches otherwise queue every superseded commit and starve the
# organisation's concurrent-job limit. Tags (releases) and the scheduled scan
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # Changelog entries live one file per change in changelog.d/, so pull
  # requests never conflict on CHANGELOG.md. Refuses an entry written under
  # the Unreleased heading, an invalid fragment, and merge-conflict markers in
  # any tracked text file.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog fragments and conflict markers
        run: python3 .github/scripts/release/changelog-fragments.py check

  # docs.openctem.io links (page and anchor) and github.com/openctemio file
  # links in code and docs, against the docs site source (openctemio/docs
  # main) and the repositories they name.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/docs
          ref: main
          path: .docs-site
          persist-credentials: false
      - name: Documentation links
        run: python3 scripts/check_docs_links.py --docs .docs-site --fetch-other .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          # Tests drive the SDK against httptest.NewServer, which binds
          # to 127.0.0.1. pkg/httpsec.SafeHTTPClient normally rejects
          # loopback targets; the env var opts tests into the loopback
          # carve-out. Its own unit tests still assert the production
          # posture (AllowLoopback=false via TestMain).
          OPENCTEM_SDK_HTTPSEC_ALLOW_LOOPBACK: "1"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out

  # The sandbox's network confinement needs unprivileged user namespaces,
  # which the runner's host refuses (AppArmor). Its tests run here in a
  # container whose seccomp profile allows them, as a non-root user the
  # host does not otherwise use, and must not skip.
  sandbox-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETNS_IMAGE: ghcr.io/openctemio/mirror/debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Build the executor and tool host tests
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/netns/executor.test" ./pkg/sensorkit/executor/
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/netns/toolhost.test" ./pkg/sensorkit/toolhost/

      # Public CI image mirror (openctemio/openctem .github/ci-images.txt):
      # same digest as the upstream image, without the anonymous
      # public.ecr.aws / Docker Hub quotas shared by runner IPs. The login is
      # non-fatal (fork pull requests pull the public package anonymously); the
      # pull retries with backoff on registry errors.
      - name: Pull the test container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null 2>&1 \
            || echo "::notice::GHCR login failed; pulling anonymously"
          delay=10
          for i in 1 2 3 4 5; do
            docker pull -q "$NETNS_IMAGE" && exit 0
            [ "$i" -lt 5 ] && { echo "::warning::pull attempt $i failed; retrying in ${delay}s"; sleep "$delay"; delay=$((delay * 2)); }
          done
          exit 1

      - name: Run them confined
        run: |
          chmod -R a+rX "$RUNNER_TEMP/netns" .
          # Each runs in its package directory (tests read testdata/).
          for t in executor toolhost; do
            docker run --rm --user 23456:23456 --security-opt seccomp=unconfined \
              -e OPENCTEM_TEST_REQUIRE_NETNS=1 -v "$RUNNER_TEMP/netns:/t:ro" \
              -v "$PWD/pkg/sensorkit/$t:/src:ro" -w /src \
              "$NETNS_IMAGE" \
              "/t/$t.test" -test.v -test.count=1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.14.0

  # pkg/ctis re-exports github.com/openctemio/ctis/v2 (generated aliases). Fails
  # when the generated file is stale for the ctis version in go.mod, or when
  # pkg/ctis starts copying model types again — see scripts/check-ctis-parity.sh.
  ctis-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Check pkg/ctis re-exports the CTIS module
        run: ./scripts/check-ctis-parity.sh

  # Sensor protocol v3 (openctem api RFC-059): the .proto is the platform's,
  # buf lint passes and pkg/sensorproto/v3 is what buf generate writes.
  proto-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Proto v3 copy, lint and generated code
        run: ./scripts/check-proto-v3.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  # The openctem CLI on a real Windows runner: the import, targets and run
  # commands (file patterns, UTF-16 exports, CRLF, owner-only files, the
  # private CA) and the binary's entry point, then "go install" of this
  # commit from the module proxy into an empty GOPATH, as the install docs
  # tell people to do.
  windows-cli:
    name: windows (openctem CLI)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Unit tests
        shell: pwsh
        run: go test ./cmd/openctem/... ./internal/importcli/... ./pkg/importtool/...

      - name: Exit status and a pattern in cmd.exe
        shell: cmd
        run: |
          go build -o %RUNNER_TEMP%\openctem.exe .\cmd\openctem || exit /b 1
          mkdir %RUNNER_TEMP%\scans
          echo www.example.com> %RUNNER_TEMP%\scans\a.txt
          echo api.example.com> %RUNNER_TEMP%\scans\b.txt
          %RUNNER_TEMP%\openctem.exe import --format lines --as domain --dry-run %RUNNER_TEMP%\scans\*.txt > NUL
          if errorlevel 1 exit /b 1
          %RUNNER_TEMP%\openctem.exe import --no-such-flag 2> NUL
          if not errorlevel 2 exit /b 1
          exit /b 0

      - name: The documented PowerShell install, against a local release
        # Runs the install block of docs/tools/cli.md in Windows PowerShell
        # 5.1 with the release URL pointed at a local server holding a zip
        # and SHA256SUMS built the way release.yml builds them, then once
        # more with a wrong checksum, which must stop it.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Get-Content -Raw docs/tools/cli.md
          $m = [regex]::Match($md, '(?s)<!-- install-openctem-windows[^\n]*\n```powershell\r?\n(.*?)```')
          if (-not $m.Success) { throw 'install block not found in docs/tools/cli.md' }
          $script = $m.Groups[1].Value
          $v = [regex]::Match($script, "\`$v = '([0-9.]+)'").Groups[1].Value
          if (-not $v) { throw 'no version in the install block' }
          $rel = Join-Path $env:RUNNER_TEMP 'rel'; $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory $rel, $stage | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -o "$stage\openctem.exe" ./cmd/openctem
          Copy-Item LICENSE, NOTICE $stage
          $zip = "openctem_${v}_windows_amd64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath "$rel\$zip"
          $h = (Get-FileHash -Algorithm SHA256 "$rel\$zip").Hash.ToLower()
          Set-Content -NoNewline -Path "$rel\SHA256SUMS" -Value "$h  $zip`n"
          if ($script -notmatch [regex]::Escape('https://github.com/openctemio/sdk-go/releases/download/v$v')) { throw 'release URL changed' }
          $server = Start-Process python -ArgumentList '-m', 'http.server', '18089', '--bind', '127.0.0.1', '--directory', $rel -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $script = $script.Replace('https://github.com/openctemio/sdk-go/releases/download/v$v', 'http://127.0.0.1:18089')
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'lad'
            Set-Content -Path (Join-Path $env:RUNNER_TEMP 'install.ps1') -Value $script
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RUNNER_TEMP 'install.ps1')
            if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\openctem\openctem.exe'
            & $exe version
            if ($LASTEXITCODE -ne 0) { throw 'openctem.exe does not run' }
            Set-Content -NoNewline -Path "$rel\SHA256SUMS" -Value ("0" * 64 + "  $zip`n")
            Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'Programs')
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RUNNER_TEMP 'install.ps1')
            if ($LASTEXITCODE -eq 0 -or (Test-Path $exe)) { throw 'a wrong checksum was installed' }
            'a wrong checksum stopped the install'
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: TEMP probe Mark-of-the-Web on downloads
        continue-on-error: true
        shell: powershell
        run: |
          $u = 'https://github.com/openctemio/sdk-go/releases/download/v0.48.0/openctem_0.48.0_linux_amd64.tar.gz'
          $d = Join-Path $env:RUNNER_TEMP 'motw'; New-Item -ItemType Directory $d | Out-Null
          $PSVersionTable.PSVersion.ToString()
          [Environment]::OSVersion.VersionString
          Invoke-WebRequest -UseBasicParsing $u -OutFile "$d\iwr.bin"
          curl.exe -sSL -o "$d\curl.bin" $u
          (New-Object Net.WebClient).DownloadFile($u, "$d\webclient.bin")
          Start-BitsTransfer -Source $u -Destination "$d\bits.bin" -ErrorAction SilentlyContinue
          foreach ($f in 'iwr','curl','webclient','bits') { $s = Get-Item "$d\$f.bin" -Stream Zone.Identifier -ErrorAction SilentlyContinue; "MOTW $f (powershell 5.1): " + [bool]$s }
          Set-Content -Path "$d\marked.zip:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3"
          Compress-Archive -Path "$d\iwr.bin" -DestinationPath "$d\z.zip"
          Set-Content -Path "$d\z.zip:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3"
          Expand-Archive "$d\z.zip" -DestinationPath "$d\x"
          "MOTW propagated by Expand-Archive: " + [bool](Get-Item "$d\x\iwr.bin" -Stream Zone.Identifier -ErrorAction SilentlyContinue)
          Unblock-File "$d\z.zip"
          "MOTW after Unblock-File: " + [bool](Get-Item "$d\z.zip" -Stream Zone.Identifier -ErrorAction SilentlyContinue)

      - name: TEMP probe Mark-of-the-Web (pwsh 7)
        continue-on-error: true
        shell: pwsh
        run: |
          $u = 'https://github.com/openctemio/sdk-go/releases/download/v0.48.0/openctem_0.48.0_linux_amd64.tar.gz'
          $d = Join-Path $env:RUNNER_TEMP 'motw7'; New-Item -ItemType Directory $d | Out-Null
          $PSVersionTable.PSVersion.ToString()
          Invoke-WebRequest $u -OutFile "$d\iwr.bin"
          "MOTW iwr (pwsh 7): " + [bool](Get-Item "$d\iwr.bin" -Stream Zone.Identifier -ErrorAction SilentlyContinue)

      - name: go install from the module proxy (no replace directives)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:GOPATH = Join-Path $env:RUNNER_TEMP 'gopath'
          $env:GOMODCACHE = Join-Path $env:GOPATH 'pkg\mod'
          $env:GOFLAGS = '-modcacherw'
          Push-Location $env:RUNNER_TEMP
          go install "github.com/openctemio/sdk-go/cmd/openctem@$env:REF"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & (Join-Path $env:GOPATH 'bin\openctem.exe') version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location



  # Exported-API compatibility (api RFC-029 §8.6), weighed by stability tier
  # (docs/STABILITY.md; every package comment states its tier): an
  # incompatible change to a Stable or Frozen package fails unless the PR is
  # labelled breaking-change (and a changelog.d/ fragment says how to upgrade
  # under "### Upgrade notes"); a Beta change is a warning; Internal-bound and
  # Deprecated packages are ignored. A package without a tier fails.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba

      - name: Tests of the compatibility check
        run: bash scripts/test-api-compat.sh

      # Gate on THIS change only: compare with the PR base (origin/<base>), so an
      # intended break that already merged with its breaking-change label does
      # not fail every later PR until the next release. A push to main compares
      # with the latest release as a report: every change on main passed this
      # gate as a PR, so its breaks are declared (warnings, not a red main).
      - name: Compare with the base branch (PR) or the latest release (push)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        env:
          API_COMPAT_BREAKING_DECLARED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: scripts/check-api-compat.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Compare with the base branch (breaking change declared)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        env:
          API_COMPAT_BREAKING_DECLARED: '1'
        run: |
          scripts/check-api-compat.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          grep -qs '^### Upgrade notes' changelog.d/*.md || { echo "::error::breaking-change needs a changelog.d/<slug>.md fragment with an '### Upgrade notes' section"; exit 1; }

  # The sensor (github.com/openctemio/sensor, main) must build against this
  # change without edits: that is what "bump the SDK and done" means for the
  # one sensor we ship. Both builds (default and -tags platform) and vet.
  # Paired branches: an intended break ships with a sensor branch of the same
  # name as the pull request's head branch; when openctemio/sensor has that
  # branch, a pull request builds it instead of main. A push (main) always
  # builds sensor main. The branch name reaches the script only through env.
  sensor-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk-go

      - name: Pick the sensor branch (paired branch, else main)
        id: sensor-ref
        env:
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: |
          ref=main
          if [ -n "$HEAD_REF" ] && git check-ref-format --branch "$HEAD_REF" >/dev/null 2>&1 &&
            git ls-remote --exit-code --heads https://github.com/openctemio/sensor.git "refs/heads/$HEAD_REF" >/dev/null; then
            ref="$HEAD_REF"
          fi
          echo "sensor ref: $ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/sensor
          ref: ${{ steps.sensor-ref.outputs.ref }}
          path: sensor

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build the sensor against this SDK
        working-directory: sensor
        env:
          GOWORK: "off"
        run: |
          go mod edit -replace github.com/openctemio/sdk-go=../sdk-go
          go mod tidy
          go build ./...
          go build -tags platform ./...
          go vet ./...
