# Betterleaks configuration for sdk (gitleaks-compatible format)
# https://github.com/betterleaks/betterleaks/blob/main/docs/config.md

title = "sdk betterleaks config"

# Start from the built-in rules. Without this the file defines no rules at
# all and every scan passes (the old .gitleaks.toml had that bug).
[extend]
useDefault = true

[allowlist]
description = "Global allowlist"

# Paths to ignore
paths = [
    '''_test\.go$''',
    '''\.md$''',
    '''go\.sum$''',
    '''examples/''',
    '''docs/''',
]

# Regex patterns to allow (common false positives)
regexes = [
    '''example[_-]?token''',
    '''test[_-]?token''',
    '''YOUR_[A-Z_]+_HERE''',
    '''placeholder''',
    '''xxxx''',
    # GitHub PAT placeholder pattern
    '''ghp_x{10,}''',
]
