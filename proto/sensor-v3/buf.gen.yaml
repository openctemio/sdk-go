# Generates pkg/sensorproto/v3 (committed). Run: scripts/check-proto-v3.sh --generate
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: openctem/sensor/v3/sensor.proto
      value: github.com/openctemio/sdk-go/pkg/sensorproto/v3;sensorv3
plugins:
  - local: protoc-gen-go
    out: ../..
    opt: module=github.com/openctemio/sdk-go
  - local: protoc-gen-connect-go
    out: ../..
    opt: module=github.com/openctemio/sdk-go
