# OpenCTEM tool checks: validate the descriptor, run the conformance kit
# (self-tests, the capability's suites on local fixtures, the scope check,
# parser fuzzing) and refuse a descriptor change without the right version
# bump. On a version tag, build the pack image, push it and sign its digest
# (docs/tool-packs.md). Copy to .github/workflows/ in the tool's repository.
name: openctem-tool

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install the openctem CLI
        run: go install github.com/openctemio/sdk-go/cmd/openctem@latest
      - name: Validate the descriptor
        run: openctem tool validate .
      - name: Conformance
        run: openctem tool test --capability --scope --fuzz 30s .
      - name: Version bump of a descriptor change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          if git show "origin/$BASE_REF:tool.yaml" > "$RUNNER_TEMP/old/tool.yaml" 2>/dev/null; then
            openctem tool diff "$RUNNER_TEMP/old/tool.yaml" tool.yaml
          fi

  publish:
    # A version tag vX.Y.Z of a pack whose pack.yaml says X.Y.Z: build the pack
    # image, push it, sign its digest keylessly with this workflow's identity.
    # Register the printed digest in the console, never the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install the openctem CLI
        run: go install github.com/openctemio/sdk-go/cmd/openctem@latest
      - name: The tag is the pack version
        run: test "v$(openctem tool describe --json . | jq -r .version)" = "$GITHUB_REF_NAME"
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the pack image
        id: build
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          out=$(openctem tool build . --push "$repo:$GITHUB_REF_NAME")
          echo "$out"
          digest=$(printf '%s\n' "$out" | sed -n 's/^built .*@\(sha256:[0-9a-f]\{64\}\)$/\1/p')
          test -n "$digest"
          echo "ref=$repo@$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image digest
        env:
          REF: ${{ steps.build.outputs.ref }}
        run: |
          cosign sign --yes --recursive "$REF"
          echo "Pack image: $REF" >> "$GITHUB_STEP_SUMMARY"
