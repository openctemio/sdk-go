# OpenCTEM tool checks: validate the descriptor, run the conformance kit
# (self-tests, the capability's suites on local fixtures, the scope check,
# parser fuzzing) and refuse a descriptor change without the right version
# bump. On a version tag, build the pack image, push it to the project's
# registry and sign its digest (docs/tool-packs.md). Include it from
# .gitlab-ci.yml.
openctem-tool:
  image: golang:latest
  stage: test
  script:
    - go install github.com/openctemio/sdk-go/cmd/openctem@latest
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - openctem tool validate .
    - openctem tool test --capability --scope --fuzz 30s .
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        if git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:tool.yaml" > /tmp/base-tool.yaml 2>/dev/null; then
          mkdir -p /tmp/old && cp /tmp/base-tool.yaml /tmp/old/tool.yaml
          openctem tool diff /tmp/old/tool.yaml tool.yaml
        fi
      fi

openctem-tool-publish:
  # A version tag vX.Y.Z of a pack whose pack.yaml says X.Y.Z. Register the
  # printed digest in the console, never the tag.
  image: golang:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: [openctem-tool]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - go install github.com/openctemio/sdk-go/cmd/openctem@latest
    - go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.0
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - test "v$(openctem tool describe --json . | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)" = "$CI_COMMIT_TAG"
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" > ~/.docker/config.json
    - out=$(openctem tool build . --push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG") && echo "$out"
    - digest=$(printf '%s\n' "$out" | sed -n 's/^built .*@\(sha256:[0-9a-f]\{64\}\)$/\1/p') && test -n "$digest"
    - cosign sign --yes --recursive "$CI_REGISTRY_IMAGE@$digest"
    - echo "Pack image: $CI_REGISTRY_IMAGE@$digest"
