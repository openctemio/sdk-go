# golangci-lint v2 configuration for SDK
# https://golangci-lint.run/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none
  enable:
    # Security
    - gosec
    # Bugs
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    # Style
    - gofmt
    - goimports
    - misspell
    # Complexity
    - gocyclo
    - funlen

  settings:
    gosec:
      excludes:
        - G104  # Audit errors not checked
        - G304  # File path provided as taint input
      config:
        G301: "0750"
        G302: "0640"
        G306: "0640"

    funlen:
      lines: 200
      statements: 100

    gocyclo:
      min-complexity: 50  # Increased for complex CLI code

    misspell:
      locale: US

  exclusions:
    paths:
      - vendor
      - tmp
      - examples
    rules:
      # Exclude test files from some linters
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - funlen

      # Exclude examples from most linters
      - path: examples/
        linters:
          - gosec
          - errcheck
          - funlen

      # Exclude main.go from complexity checks (CLI entry point)
      - path: cmd/.*main\.go
        linters:
          - gocyclo
          - funlen

    max-issues-per-linter: 50
    max-same-issues: 10
