# golangci-lint v2 configuration for SDK
# https://golangci-lint.run/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Security
    - gosec
    # Bugs
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    # Style
    - misspell
    # Complexity
    - gocyclo
    - funlen

  settings:
    gosec:
      excludes:
        - G101  # False positive on secret type mapping tables
        - G104  # Audit errors not checked
        - G117  # False positive on credential struct field names
        - G204  # Subprocess launched with variable (expected for scanner execution)
        - G304  # File path provided as taint input
        - G703  # Path traversal via taint (expected for git env detection)
        - G704  # SSRF via taint (expected for HTTP client SDK)
      config:
        G301: "0750"
        G302: "0640"
        G306: "0640"

    staticcheck:
      checks:
        - "all"
        - "-QF1001"  # De Morgan's law suggestion (style preference)
        - "-ST1000"  # Package comment requirement
        - "-ST1003"  # Go naming convention (JSON field names differ)
        - "-ST1022"  # Var comment format

    funlen:
      lines: 200
      statements: 100

    gocyclo:
      min-complexity: 50  # Increased for complex CLI code

    misspell:
      locale: US

  exclusions:
    paths:
      - vendor
      - tmp
      - examples
    rules:
      # Allow unchecked Close() in defer (common Go pattern)
      - text: "Error return value of .*.Close.*is not checked"
        linters:
          - errcheck

      # Exclude test files from some linters
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - funlen

      # Exclude examples from most linters
      - path: examples/
        linters:
          - gosec
          - errcheck
          - funlen

      # Exclude main.go from complexity checks (CLI entry point)
      - path: cmd/.*main\.go
        linters:
          - gocyclo
          - funlen
